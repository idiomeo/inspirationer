name: Release

# 打一个 v* 标签（例如 git tag v1.2.0 && git push origin v1.2.0）就会：
#   1. 在 windows-latest 上构建 GUI 版与控制台版
#   2. 用 scripts/make-release.ps1 组装 release/ 并生成 zip + 校验和
#   3. 创建对应的 GitHub Release 并附上这些文件
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建的标签名（workflow_dispatch 手动触发时使用，例如 v1.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false

      - name: 语法与文案检查
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) { Write-Error "未格式化: $unformatted"; exit 1 }
          go vet ./...
          go test ./...
          node scripts/check-i18n.mjs

      - name: 构建并打包 release/
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/make-release.ps1

      - name: 归档（即使没有创建 Release 也能在 Actions 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: inspirationer-windows-amd64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建（或更新）GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ github.event.inputs.tag }}' }
          if (-not $tag) { Write-Error '缺少标签名'; exit 1 }
          $files = @(Get-ChildItem release/*.zip | ForEach-Object { $_.FullName }) +
                   (Resolve-Path release/SHA256SUMS.txt).Path
          Write-Host "目标 Release：$tag"

          # 附注标签的说明就是我们的发布说明（gh release edit 不支持 --notes-from-tag，这里直接取文本）
          $notes = ((git tag -l --format='%(contents)' "$tag") -join "`n").Trim()
          if ($notes) { Write-Host "使用附注标签的说明作为正文（$($notes.Length) 字符）" }
          else { Write-Host "标签没有附注说明，改用 --generate-notes" }

          # 已存在（例如手动重跑）时只更新，避免任务因 "already exists" 失败
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release 已存在：更新附件与正文"
            gh release upload "$tag" @files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($notes) { gh release edit "$tag" --notes $notes }
            exit $LASTEXITCODE
          }

          if ($notes) {
            gh release create "$tag" --title "Inspirationer $tag" --notes $notes @files
          } else {
            gh release create "$tag" --title "Inspirationer $tag" --generate-notes @files
          }
          exit $LASTEXITCODE
